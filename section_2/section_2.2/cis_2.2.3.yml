---

{{ if and (ne .Vars.win25cis_system_role "domaincontroller") .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_2_2_3 }}
    {{ if ne .Vars.win25cis_system_role "domaincontroller" }}
file:
  win25cis_2_2_3_senetworklogonright:
    title: "2.2.3 | Ensure 'Access this computer from the network' is set to 'Administrators, Authenticated Users' (MS only) | SeNetworkLogonRight"
    path: '{{ .Vars.win25cis_snapshot_dir }}\PrivilegeRights.SeNetworkLogonRight'
    exists: true
    contents:
      - '/^S-1-5-11,S-1-5-32-544$/'
    skip: {{ if not .Vars.win25cis_win_skip_for_test }}false{{ else }}true{{ end }}
    skip-reason: "win_skip_for_test is set - the role leaves this control alone so the managing connection survives; set win_skip_for_test: false to apply it"
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.2.3
      NIST800-53R5:
        - AC-2
        - AC-3
        - AC-6
        - AC-6(1)
        - AC-6(7)
        - AU-9(4)
    {{ end }}
  {{ end }}
{{ end }}
