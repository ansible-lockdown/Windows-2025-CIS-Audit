    path: '{{ .Vars.win25cis_snapshot_dir }}\PrivilegeRights.SeNetworkLogonRight'
    exists: true
    contents:
      - '/^S-1-5-11,S-1-5-32-544,S-1-5-9$/'
    meta:
      domaincontroller: 1
      server: 1
      CIS_ID:
        - 2.2.2
      NIST800-53R5:
        - AC-3
    {{ end }}
  {{ end }}
