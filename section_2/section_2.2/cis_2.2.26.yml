---

{{ if and (ne .Vars.win25cis_system_role "domaincontroller") .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_2_2_26 }}
    {{ if eq .Vars.win25cis_system_role "memberserver" }}
file:
  win25cis_2_2_26_sedenyremoteinteractivelogonright:
    title: "2.2.26 | Ensure 'Deny log on through Remote Desktop Services' is set to 'Guests, Local account' (MS only) | SeDenyRemoteInteractiveLogonRight"
    path: '{{ .Vars.win25cis_snapshot_dir }}\PrivilegeRights.SeDenyRemoteInteractiveLogonRight'
    exists: true
    contents:
      - '/^S-1-5-113,S-1-5-32-546$/'
    skip: {{ if not .Vars.win25cis_win_skip_for_test }}false{{ else }}true{{ end }}
    skip-reason: "win_skip_for_test is set - the role leaves this control alone so the managing connection survives; set win_skip_for_test: false to apply it"
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.2.26
      NIST800-53R5:
        - AC-3
    {{ end }}
  {{ end }}
{{ end }}
