---

{{ if and (eq .Vars.win25cis_system_role "domaincontroller") .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_2_2_47 }}
    {{ if eq .Vars.win25cis_system_role "domaincontroller" }}
file:
  win25cis_2_2_47_sesyncagentprivilege:
    title: "2.2.47 | Ensure 'Synchronize directory service data' is set to 'No One' (DC only) | SeSyncAgentPrivilege"
    path: '{{ .Vars.win25cis_snapshot_dir }}\PrivilegeRights.SeSyncAgentPrivilege'
    exists: true
    contents:
      - '/^NONE$/'
    meta:
      domaincontroller: 1
      server: 1
      CIS_ID:
        - 2.2.47
      NIST800-53R5:
        - AC-2
        - AC-3
        - AC-6
        - AC-6(1)
        - AC-6(7)
        - AU-9(4)
    {{ end }}
  {{ end }}
{{ end }}
