---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_2_3_1_3 }}
file:
  win25cis_2_3_1_3_newadministratorname:
    title: "2.3.1.3 | Configure 'Accounts: Rename administrator account' | NewAdministratorName"
    path: '{{ .Vars.win25cis_snapshot_dir }}\SystemAccess.NewAdministratorName'
    exists: true
    contents:
      - '/^.+$/'
      - '!/^Administrator$/'
    skip: {{ if not .Vars.win25cis_win_skip_for_test }}false{{ else }}true{{ end }}
    skip-reason: "win_skip_for_test is set - the role leaves this control alone so the managing connection survives; set win_skip_for_test: false to apply it"
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.1.3
      NIST800-53R5:
        - IA-4b
  {{ end }}
{{ end }}
