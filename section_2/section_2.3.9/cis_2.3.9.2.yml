---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_2_3_9_2 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\RequireSecuritySignature:
    title: "2.3.9.2 | Ensure 'Microsoft network server: Digitally sign communications (always)' is set to 'Enabled' | RequireSecuritySignature"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.9.2
      NIST800-53R5:
        - SC-23
  {{ end }}
{{ end }}
