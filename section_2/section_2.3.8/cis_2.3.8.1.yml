---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_2_3_8_1 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\RequireSecuritySignature:
    title: "2.3.8.1 | Ensure 'Microsoft network client: Digitally sign communications (always)' is set to 'Enabled' | RequireSecuritySignature"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.8.1
      NIST800-53R5:
        - SC-8(1)
  {{ end }}
{{ end }}
