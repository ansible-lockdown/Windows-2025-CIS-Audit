{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_18_6_7_4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\EnableAuthRateLimiter:
    title: "18.6.7.4 | Ensure 'Enable authentication rate limiter' is set to 'Enabled' | EnableAuthRateLimiter"
