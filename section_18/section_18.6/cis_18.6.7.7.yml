---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_18_6_7_7 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanServer\InvalidAuthenticationDelayTimeInMs:
    title: "18.6.7.7 | Ensure 'Set authentication rate limiter delay (milliseconds)' is set to 'Enabled: 2000' or more | InvalidAuthenticationDelayTimeInMs"
    exists: true
    value: {{ .Vars.win25cis_invalid_authentication_delay_time }}
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.6.7.7
      NIST800-53R5:
        - AC-7b
  {{ end }}
{{ end }}
