---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_18_7_8 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Control\Print\RpcAuthnLevelPrivacyEnabled:
    title: "18.7.8 | Ensure 'Configure RPC packet level privacy setting for incoming connections' is set to 'Enabled' | RpcAuthnLevelPrivacyEnabled"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.7.8
      NIST800-53R5:
        - SC-8(1)
  {{ end }}
{{ end }}
