---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_18_7_10 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint\RestrictDriverInstallationToAdministrators:
    title: "18.7.10 | Ensure 'Limits print driver installation to Administrators' is set to 'Enabled' | RestrictDriverInstallationToAdministrators"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.7.10
      NIST800-53R5:
        - CM-11(2)
  {{ end }}
{{ end }}
