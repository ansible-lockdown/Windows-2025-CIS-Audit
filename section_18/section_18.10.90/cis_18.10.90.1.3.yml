---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_18_10_90_1_3 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Winrm\Client\AllowDigest:
    title: "18.10.90.1.3 | Ensure 'Disallow Digest authentication' is set to 'Enabled' | AllowDigest"
    exists: true
    value: 0
    type: REG_DWORD
    skip: {{ if not .Vars.win25cis_win_skip_for_test }}false{{ else }}true{{ end }}
    skip-reason: "win_skip_for_test is set - the role leaves this control alone so the managing connection survives; set win_skip_for_test: false to apply it"
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.90.1.3
      NIST800-53R5:
        - CM-7b
  {{ end }}
{{ end }}
