---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_18_10_57_3_9_4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\UserAuthentication:
    title: "18.10.57.3.9.4 | Ensure 'Require user authentication for remote connections by using Network Level Authentication' is set to 'Enabled' | UserAuthentication"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.57.3.9.4
      NIST800-53R5:
        - SC-23
  {{ end }}
{{ end }}
