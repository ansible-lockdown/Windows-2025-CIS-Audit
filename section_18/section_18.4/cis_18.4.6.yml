---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_18_4_6 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\NodeType:
    title: "18.4.6 | Ensure 'NetBT NodeType configuration' is set to 'Enabled: P-node (recommended)' | NodeType"
    exists: true
    value: {{ .Vars.win25cis_netbt_nodetype }}
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.4.6
      NIST800-53R5:
        - CM-7b
  {{ end }}
{{ end }}
