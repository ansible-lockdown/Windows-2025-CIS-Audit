---

{{ if and (ne .Vars.win25cis_system_role "domaincontroller") .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_18_9_39_3 }}
    {{ if ne .Vars.win25cis_system_role "domaincontroller" }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\SAM\SamrChangeUserPasswordApiPolicy:
    title: "18.9.39.3 | Ensure 'Configure SAM change password RPC methods policy' is set to 'Enabled: Block all change password RPC methods' (MS only) | SamrChangeUserPasswordApiPolicy"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.39.3
      NIST800-53R5:
        - AC-17
        - SC-12
    {{ end }}
  {{ end }}
{{ end }}
