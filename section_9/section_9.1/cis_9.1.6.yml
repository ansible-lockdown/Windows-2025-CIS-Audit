---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_9_1_6 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\Logging\LogDroppedPackets:
    title: "9.1.6 | Ensure 'Windows Firewall: Domain: Logging: Log dropped packets' is set to 'Yes' | LogDroppedPackets"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 9.1.6
      NIST800-53R5:
        - AU-2c
  {{ end }}
{{ end }}
